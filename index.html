<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osmanlıca Tapu Terimleri Sözlüğü</title>
    <style>
        /* CSS Değişkenleri (Tema Yönetimi) */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --header-bg: #2c3e50;
            --header-text: #fff;
            --card-bg: #fff;
            --card-border: #e0e0e0;
            --primary-color: #3498db;
            --arabic-color: #8e44ad;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --header-bg: #1f1f1f;
            --header-text: #e0e0e0;
            --card-bg: #1e1e1e;
            --card-border: #333;
            --primary-color: #bb86fc;
            --arabic-color: #d7bde2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Üst Başlık ve Butonlar */
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 20px;
            text-align: center;
        }

        .header-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .theme-btn { background-color: #444; color: #fff; }
        .theme-btn:hover { background-color: #666; }
        
        .share-btn { background-color: #25D366; color: #fff; }
        .share-btn:hover { background-color: #20b858; }

        /* Sekme (Tab) Menüsü */
        .tabs {
            display: flex;
            justify-content: center;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--card-border);
        }

        .tab-btn {
            padding: 15px 20px;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-color);
            font-weight: bold;
            font-size: 16px;
        }

        .tab-btn.active {
            border-bottom: 3px solid var(--primary-color);
            color: var(--primary-color);
        }

        .tab-content {
            display: none;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .tab-content.active {
            display: block;
        }

        /* Arama ve Filtreleme */
        .search-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select {
            padding: 12px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
        }

        /* Kaydırılabilir (Swipeable / Slider) Kart Konteyneri */
        .slider-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 15px;
            padding-bottom: 15px;
            scrollbar-width: none; /* Firefox */
        }

        .slider-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari */
        }

        /* Terim Kartları */
        .card {
            flex: 0 0 85%; /* Mobilde görünüm */
            scroll-snap-align: center;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @media (min-width: 768px) {
            .card { flex: 0 0 45%; } /* Tablet */
        }

        @media (min-width: 1024px) {
            .card { flex: 0 0 31%; } /* Masaüstü */
        }

        .card h3 {
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
        }

        /* Arapça / Osmanlıca Yazılış Alanı */
        .arabic-text {
            font-size: 28px;
            text-align: right;
            margin: 12px 0;
            color: var(--arabic-color);
            font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
            font-weight: bold;
        }

        .card p { line-height: 1.5; margin-bottom: 15px; font-size: 15px; }
        .card .category { font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; }
        
        .fav-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #ccc;
        }
        .fav-btn.active { color: #f1c40f; }

        /* Bilgi Testi (Quiz) */
        .quiz-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }
        
        .quiz-option {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--card-border);
            border-radius: 5px;
            background-color: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            transition: 0.2s;
        }

        .quiz-option:hover { background-color: var(--card-border); }
        .quiz-option.correct { background-color: #2ecc71 !important; color: white; }
        .quiz-option.wrong { background-color: #e74c3c !important; color: white; }
        
        #next-question-btn, #start-quiz-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>📜 Osmanlıca Tapu Terimleri Sözlüğü</h1>
        <div class="header-controls">
            <button id="themeToggle" class="btn theme-btn">🌙 Gece Modu</button>
            <button onclick="shareOnWhatsApp()" class="btn share-btn">📲 WhatsApp'ta Paylaş</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('sozluk')">🔍 Sözlük</button>
        <button class="tab-btn" onclick="openTab('favoriler')">⭐ Favoriler</button>
        <button class="tab-btn" onclick="openTab('quiz')">🧠 Bilgi Testi</button>
    </div>

    <!-- SÖZLÜK SEKMESİ -->
    <div id="sozluk" class="tab-content active">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Terim, Osmanlıca yazılış veya anlam içinde ara...">
            <select id="categorySelect">
                <option value="Tümü">Tüm Kategoriler</option>
            </select>
        </div>
        <div id="dictionaryResults" class="slider-container">
            <!-- Kartlar JS ile Yüklenecek -->
        </div>
    </div>

    <!-- FAVORİLER SEKMESİ -->
    <div id="favoriler" class="tab-content">
        <h2>⭐ Favori Terimleriniz</h2>
        <p style="margin-bottom:15px; font-size:14px; color:#888;">Favoriye eklediğiniz terimler cihazınıza kaydedilir.</p>
        <div id="favoritesResults" class="slider-container">
            <!-- Favori Kartları -->
        </div>
    </div>

    <!-- BİLGİ TESTİ SEKMESİ -->
    <div id="quiz" class="tab-content">
        <h2>Bilgi Testi (Quiz)</h2>
        <p>Öğrendiğiniz terimleri pekiştirmek için 10 soruluk rastgele teste katılın.</p>
        <button id="start-quiz-btn" onclick="startQuiz()">Testi Başlat</button>
        
        <div id="quiz-area" class="quiz-container" style="display: none; margin-top: 20px;">
            <h3 id="question-text" style="margin-bottom: 15px; color: var(--primary-color);"></h3>
            <div id="options-area"></div>
            <p id="quiz-feedback" style="margin-top: 10px; font-weight: bold;"></p>
            <button id="next-question-btn" style="display: none;" onclick="nextQuestion()">Sonraki Soru</button>
        </div>
        
        <div id="quiz-result" style="display: none; margin-top: 20px;">
            <h3>Test Tamamlandı!</h3>
            <p id="score-text" style="font-size:18px; margin: 15px 0;"></p>
            <button onclick="startQuiz()">Yeniden Başla</button>
        </div>
    </div>

    <script>
        // --- 1. TÜM KELİMELER, KATEGORİLER VE ARAPÇA/OSMANLICA METİNLER VERİ SETİ ---
        const termData = [
            { terim: "Arz", osmanlica: "عرض", anlam: "Bir yeri, durumu veya araziyi yetkili makama sunma, bildirme veya gösterme.", kategori: "Tapu & İşlem" },
            { terim: "Defter-i Hakani", osmanlica: "دفتر خاقانی", anlam: "Osmanlı Devleti'nde arazi, tapu ve mülk kayıtlarının tutulduğu ana devlet arşivi ve idaresi.", kategori: "Kurum & Hukuk" },
            { terim: "Tahrir", osmanlica: "تحرير", anlam: "Eyaletlerdeki vergi yükümlülerini, arazi mülkiyetlerini ve gelirleri kaydetmek amacıyla yapılan resmi sayım işlemi.", kategori: "Hukuk & Kayıt" },
            { terim: "Miri Arazi", osmanlica: "میری أراضي", anlam: "Mülkiyeti devlete (hazineye) ait olan, kullanım hakkı kişilere devredilebilen topraklar.", kategori: "Arazi Türleri" },
            { terim: "Mülk Arazi", osmanlica: "ملك أراضي", anlam: "Kullanım ve mülkiyet hakkı tamamen şahıslara ait olan serbest topraklar.", kategori: "Arazi Türleri" },
            { terim: "Vakıf Arazi", osmanlica: "وقف أراضي", anlam: "Geliri dini, hayri veya sosyal bir hizmete tahsis edilmiş mülk ve araziler.", kategori: "Arazi Türleri" },
            { terim: "Metruk Arazi", osmanlica: "متروك أراضي", anlam: "Yol, meydan, harman yeri gibi kamunun ortak kullanımına bırakılmış alanlar.", kategori: "Arazi Türleri" },
            { terim: "Mevat Arazi", osmanlica: "موات أراضي", anlam: "Yerleşim yerlerine uzak, imar edilmemiş, çorak ve kimsenin mülkiyetinde olmayan ölü topraklar.", kategori: "Arazi Türleri" },
            { terim: "Tapu Senedi", osmanlica: "طابو سندی", anlam: "Bir arazinin veya taşınmazın tasarruf hakkının kime ait olduğunu gösteren resmi belge.", kategori: "Tapu & İşlem" },
            { terim: "Yoklama Defteri", osmanlica: "يوقلمه دفتری", anlam: "Arazi sahiplerinin ve ellerindeki tapu kayıtlarının yerinde doğrulanması amacıyla tutulan defterler.", kategori: "Kayıt & Arşiv" },
            { terim: "Kocan", osmanlica: "کوچان", anlam: "Tapu senedinin idarede kalan resmi dip koçanı veya sureti.", kategori: "Tapu & İşlem" },
            { terim: "İfraz", osmanlica: "إفراز", anlam: "Tek bir parsel veya arazinin kanuni yollarla birden fazla müstakil parsele bölünmesi işlemi.", kategori: "Arazi İşlemleri" },
            { terim: "Tevhit", osmanlica: "توحيد", anlam: "Birbirine bitişik birden fazla arazinin veya parselin tek bir tapuda birleştirilmesi.", kategori: "Arazi İşlemleri" },
            { terim: "Ferağ", osmanlica: "فراغ", anlam: "Bir kimsenin mülkiyetindeki veya tasarrufundaki arazinin hakkını başkasına devretmesi.", kategori: "Tapu & İşlem" },
            { terim: "İntikal", osmanlica: "إنتقال", anlam: "Vefat eden bir kimsenin taşınmaz tasarruf haklarının kanuni mirasçılarına geçmesi.", kategori: "Hukuk & Miras" },
            { terim: "Şufa Hakkı", osmanlica: "شفعة", anlam: "Hisseli bir taşınmazda hisse dışarıya satılırken diğer hissedarların öncelikli satın alma hakkı (Önalım).", kategori: "Hukuk & Miras" },
            { terim: "Gedik", osmanlica: "كديد", anlam: "Bir dükkan veya imalathanede zanaat icra etme ve oradaki edevatı kullanma hakkı gösteren özel mülkiyet türü.", kategori: "Hukuk & Esnaf" },
            { terim: "Rumi Takvim", osmanlica: "رومي تقویم", anlam: "Güneş yılı esasına dayanan, Osmanlı'da mali işlerde ve tapu kayıtlarında kullanılan resmi takvim.", kategori: "Takvim" },
            { terim: "Hicri Takvim", osmanlica: "هجري تقویم", anlam: "Ay yılı esasına dayanan, Hicret'i başlangıç kabul eden dini ve resmi takvim.", kategori: "Takvim" },
            { terim: "Mart", osmanlica: "مارت", anlam: "Rumi takvime göre yılın ilk ayı.", kategori: "Takvim" },
            { terim: "Teşrin-i Evvel", osmanlica: "تشرين أول", anlam: "Rumi takvimde Ekim ayına karşılık gelen dönem.", kategori: "Takvim" },
            { terim: "Teşrin-i Sani", osmanlica: "تشرين ثاني", anlam: "Rumi takvimde Kasım ayına karşılık gelen dönem.", kategori: "Takvim" },
            { terim: "Kanun-ı Evvel", osmanlica: "کانون أول", anlam: "Rumi takvimde Aralık ayına karşılık gelen dönem.", kategori: "Takvim" },
            { terim: "Kanun-ı Sani", osmanlica: "کانون ثاني", anlam: "Rumi takvimde Ocak ayına karşılık gelen dönem.", kategori: "Takvim" },
            { terim: "Dönüm", osmanlica: "دونوم", anlam: "Eski ölçü sisteminde yaklaşık 919 metrekarelik alan birimi (Yeni dönüm 1000m²'dir).", kategori: "Ölçü Birimleri" },
            { terim: "Arşın", osmanlica: "آرشين", anlam: "Yaklaşık 68-75 cm arasında değişen geleneksel uzunluk ölçüsü birimi.", kategori: "Ölçü Birimleri" },
            { terim: "Zira", osmanlica: "ذراع", anlam: "Mimarlık ve arazi ölçümlerinde kullanılan, yaklaşık 75,8 cm'ye karşılık gelen uzunluk ölçüsü.", kategori: "Ölçü Birimleri" },
            { terim: "Kulaç", osmanlica: "قلاچ", anlam: "Açılmış iki kolun parmak uçları arasındaki mesafe (yaklaşık 1.89 metre).", kategori: "Ölçü Birimleri" },
            { terim: "Okka", osmanlica: "أوقة", anlam: "1282 grama karşılık gelen geleneksel ağırlık birimi.", kategori: "Ölçü Birimleri" },
            { terim: "Dirhem", osmanlica: "درهم", anlam: "Okkanın 400'de birine eşit olan (yaklaşık 3.2 gram) ağırlık birimi.", kategori: "Ölçü Birimleri" }
        ];

        // --- 2. TEMA VE PAYLAŞIM AYARLARI ---
        const themeBtn = document.getElementById('themeToggle');
        
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeBtn.textContent = '☀️ Gündüz Modu';
        }

        themeBtn.addEventListener('click', () => {
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeBtn.textContent = '🌙 Gece Modu';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeBtn.textContent = '☀️ Gündüz Modu';
            }
        });

        function shareOnWhatsApp() {
            const url = window.location.href;
            const message = `Osmanlıca Tapu Terimleri Sözlüğü'ne göz at! Harika bir kaynak: ${url}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`);
        }

        // --- 3. SEKME YÖNETİMİ ---
        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.currentTarget.classList.add('active');
            
            if (tabName === 'favoriler') renderFavorites();
        }

        // --- 4. SÖZLÜK, ARAMA VE FAVORİLER ---
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

        function toggleFavorite(terim) {
            if (favorites.includes(terim)) {
                favorites = favorites.filter(f => f !== terim);
            } else {
                favorites.push(terim);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderDictionary();
            if (document.getElementById('favoriler').classList.contains('active')) {
                renderFavorites();
            }
        }

        function createCardHTML(item) {
            const isFav = favorites.includes(item.terim) ? 'active' : '';
            const starIcon = favorites.includes(item.terim) ? '★' : '☆';
            
            // Arapça / Osmanlıca metin görünümü kontrolü
            const arabicDisplay = item.osmanlica ? `<div class="arabic-text" dir="rtl">${item.osmanlica}</div>` : '';

            return `
                <div class="card">
                    <div>
                        <h3>${item.terim} 
                            <button class="fav-btn ${isFav}" onclick="toggleFavorite('${item.terim}')">${starIcon}</button>
                        </h3>
                        ${arabicDisplay}
                        <p>${item.anlam}</p>
                    </div>
                    <span class="category">📁 ${item.kategori}</span>
                </div>
            `;
        }

        function renderDictionary(dataToRender = termData) {
            const container = document.getElementById('dictionaryResults');
            container.innerHTML = dataToRender.map(item => createCardHTML(item)).join('');
        }

        function renderFavorites() {
            const container = document.getElementById('favoritesResults');
            const favData = termData.filter(item => favorites.includes(item.terim));
            
            if (favData.length === 0) {
                container.innerHTML = "<p style='padding:20px;'>Henüz favorilere eklenmiş bir terim bulunmuyor.</p>";
            } else {
                container.innerHTML = favData.map(item => createCardHTML(item)).join('');
            }
        }

        // Kategori Dropdown Doldurma
        const categories = [...new Set(termData.map(item => item.kategori))];
        const categorySelect = document.getElementById('categorySelect');
        categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat;
            categorySelect.appendChild(option);
        });

        // Arama ve Filtreleme Dinleyicileri (Türkçe karakter ve Osmanlıca uyumlu)
        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('categorySelect').addEventListener('change', filterData);

        function filterData() {
            const searchText = document.getElementById('searchInput').value.toLocaleLowerCase('tr-TR');
            const selectedCat = document.getElementById('categorySelect').value;

            const filtered = termData.filter(item => {
                const matchText = item.terim.toLocaleLowerCase('tr-TR').includes(searchText) || 
                                  item.anlam.toLocaleLowerCase('tr-TR').includes(searchText) ||
                                  (item.osmanlica && item.osmanlica.includes(searchText));
                const matchCat = selectedCat === "Tümü" || item.kategori === selectedCat;
                return matchText && matchCat;
            });

            renderDictionary(filtered);
        }

        // --- 5. BİLGİ TESTİ (QUIZ) MODÜLÜ ---
        let quizQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        function startQuiz() {
            document.getElementById('start-quiz-btn').style.display = 'none';
            document.getElementById('quiz-result').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            
            // 10 Rastgele soru seç
            let shuffled = [...termData].sort(() => 0.5 - Math.random());
            quizQuestions = shuffled.slice(0, 10);
            currentQuestionIndex = 0;
            score = 0;
            
            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('next-question-btn').style.display = 'none';
            document.getElementById('quiz-feedback').textContent = '';
            const optionsArea = document.getElementById('options-area');
            optionsArea.innerHTML = '';
            
            let currentItem = quizQuestions[currentQuestionIndex];
            
            // Soru başlığında Osmanlıcası varsa parantez içinde gösterme
            const osmanlicaEk = currentItem.osmanlica ? ` (${currentItem.osmanlica})` : '';
            document.getElementById('question-text').textContent = `Soru ${currentQuestionIndex + 1}/10: "${currentItem.terim}${osmanlicaEk}" teriminin anlamı nedir?`;

            // Şıkları oluştur (1 doğru, 3 yanlış)
            let options = [currentItem.anlam];
            let wrongOptions = [...termData].filter(t => t.terim !== currentItem.terim).sort(() => 0.5 - Math.random());
            for(let i=0; i<3 && i<wrongOptions.length; i++) {
                options.push(wrongOptions[i].anlam);
            }
            options = options.sort(() => 0.5 - Math.random());

            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(btn, opt, currentItem.anlam);
                optionsArea.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, selectedText, correctText) {
            const allBtns = document.querySelectorAll('.quiz-option');
            allBtns.forEach(btn => btn.disabled = true);

            if (selectedText === correctText) {
                selectedBtn.classList.add('correct');
                document.getElementById('quiz-feedback').textContent = "Tebrikler, Doğru Cevap!";
                document.getElementById('quiz-feedback').style.color = "#2ecc71";
                score++;
            } else {
                selectedBtn.classList.add('wrong');
                document.getElementById('quiz-feedback').textContent = "Yanlış Cevap.";
                document.getElementById('quiz-feedback').style.color = "#e74c3c";
                allBtns.forEach(btn => {
                    if(btn.textContent === correctText) btn.classList.add('correct');
                });
            }
            document.getElementById('next-question-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizQuestions.length) {
                loadQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('quiz-result').style.display = 'block';
            document.getElementById('score-text').textContent = `Toplam 10 soruda ${score} doğru cevap verdiniz!`;
        }

        // Sayfa yüklendiğinde sözlüğü oluştur
        window.onload = renderDictionary;
    </script>
</body>
</html>
